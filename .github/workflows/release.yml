# Publishes the SkyLine package when its version changes.
# Bump "Version:" in package/debian/control, push to main, and this workflow:
#   1. builds skyline-desktop_<version>_all.deb
#   2. installs it on a clean Debian 13 and opens the apps there
#   3. publishes GitHub release v<version> (skipped if that release already exists)
# Installed SkyLine PCs then find the update with "skyline-update" and get a notification.
name: Release SkyLine package

on:
  push:
    branches: [main]
    paths: ["package/**", "tools/build-deb.sh", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skyline-desktop.deb
        run: bash tools/build-deb.sh

      - name: Install and try it on Debian 13
        run: |
          docker run --rm -v "$PWD":/w -w /w debian:trixie bash -euxc '
            apt-get update -qq
            # The Debian KDE packages that also touch SkyLine files, like a real SkyLine/KDE install.
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              desktop-base sddm sddm-theme-breeze plymouth kinfocenter calamares-settings-debian >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/skyline-desktop_*_all.deb || { tail -n 40 /var/log/dpkg.log; exit 1; }
            for t in skyline-sky skyline-layout skyline-taskbar skyline-gamemode skyline-play skyline-update; do $t --help >/dev/null; done
            skyline-settings --help >/dev/null
            skyline-assistant --ask "make it night" | grep -qi night
            dpkg-divert --list skyline-desktop
            grep -q SkyLine /etc/xdg/kcm-about-distrorc
            apt-get remove -y skyline-desktop >/dev/null && test -f /etc/xdg/kcm-about-distrorc
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/skyline-desktop_*_all.deb >/dev/null
            export QT_QPA_PLATFORM=offscreen
            python3 - <<EOF
          import importlib.machinery, sys
          from PyQt6.QtWidgets import QApplication
          app = QApplication(sys.argv)
          S = importlib.machinery.SourceFileLoader("s", "/usr/bin/skyline-settings").load_module()
          A = importlib.machinery.SourceFileLoader("a", "/usr/bin/skyline-assistant").load_module()
          s = S.SettingsWindow("sky"); a = A.AssistantWindow()
          for i in range(len(S.PAGES)):
              s.nav.setCurrentRow(i); app.processEvents()
          a.close(); s.close()
          print("SkyLine apps open fine on Debian 13")
          EOF
          '

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^Version: //p' package/debian/control)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists. Bump Version: in package/debian/control to publish a new one."
            exit 0
          fi
          gh release create "v$version" dist/*.deb dist/*.sha256 --target "$GITHUB_SHA" \
            --title "SkyLine $version" --notes-file package/RELEASE_NOTES.md
