# Builds the SkyLine ISO on GitHub's servers. Run it from the Actions tab ("Run workflow").
# The ISO (about 3 GB) is uploaded as a downloadable artifact for 30 days.
# Artifact storage is free on public repositories; private repositories have a small storage quota.
name: Build SkyLine ISO

on:
  workflow_dispatch:
    inputs:
      with_claude:
        description: "Pre-install the Claude app"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build inside Debian 13
        run: |
          flags=""
          if [ "${{ inputs.with_claude }}" != "true" ]; then flags="--no-claude"; fi
          docker run --rm --privileged -v "$PWD":/skyline -w /skyline debian:trixie bash build.sh $flags

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: skyline-iso
          path: |
            *.iso
            *.iso.sha256
          compression-level: 0
          retention-days: 30

      - name: Upload the build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
